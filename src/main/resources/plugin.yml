name: FusionEnchanting
version: 1.0.0
main: org.leap.enchantmentfusion.EnchantmentFusion
api-version: '1.21'
description: 36 handcrafted enchantment fusions for survival
authors: [LEAP]
commands:
  fusion:
    description: FusionEnchanting recipes, information and administration
    usage: /fusion help
    aliases: [efusion]
permissions:
  enchantmentfusion.use:
    default: true
  enchantmentfusion.recipes:
    default: true
  enchantmentfusion.admin:
    default: op
  enchantmentfusion.reload:
    default: op
