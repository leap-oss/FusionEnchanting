# FusionEnchanting 1.1.0 — book + book, then book + equipment
config-version: 2
allow-pvp-abilities: false
disabled-worlds: []

# extra-levels: creation surcharge only (0..12). Applying a fusion book costs vanilla XP.
# Native prior-work penalties and Too Expensive remain unchanged.
fusions:
  # Infernal Edge: Serangan penuh membakar 3 detik; target yang sudah terbakar menerima +2 damage.
  infernal_edge:
    enabled: true
    extra-levels: 3
    cooldown-seconds: 4
    chance: 1.0
    power: 1.0
