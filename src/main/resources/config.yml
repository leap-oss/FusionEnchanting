# FusionEnchanting 1.2.0 — source book levels determine fusion tiers I–III.
config-version: 2
allow-pvp-abilities: false
disabled-worlds: []

# extra-levels: creation surcharge only (0..12). Applying a fusion book costs vanilla XP.
# Native prior-work penalties and Too Expensive remain unchanged.
fusions:
  # Infernal Edge: lower source levels create lower fusion tiers; see /fusion guide.
  infernal_edge:
    enabled: true
    extra-levels: 3
    cooldown-seconds: 4
    chance: 1.0
    power: 1.0
