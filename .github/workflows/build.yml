name: Build Plugin JAR

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Paper Plugin (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR with Maven
        run: mvn --batch-mode clean package

      - name: Upload JAR to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fusionenchanting-jar
          path: target/fusionenchanting-*.jar
          if-no-files-found: error

      - name: Publish to GitHub Releases (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/fusionenchanting-*.jar
          generate_release_notes: true
